# Install the custom bundle for this user; keep login screens on stock layouts.
[tasks."keyboard-layout:install"]
description = "Install the GB/PL Colemak bundle for this user"
run = '"{{ config_root }}/macos/keyboard/install.sh"'

[tasks.bootstrap]
depends = ["keyboard-layout:install"]

[bootstrap.files."~/Library/KeyBindings/DefaultKeyBinding.dict"]
source = "./macos/DefaultKeyBinding.dict"

[bootstrap.macos.keyboard]
press_and_hold = false
key_repeat = 2
initial_key_repeat = 15

[bootstrap.macos.finder]
show_status_bar = true
show_pathbar = true
sort_folders_first = true
preferred_view_style = "list"
show_extensions_warning = false

[bootstrap.macos.dock]
orientation = "right"
tilesize = 36
autohide_delay = 0.0
autohide_time_modifier = 0.0
autohide = true
show_recents = false

[bootstrap.macos.defaults.NSGlobalDomain]
AppleShowAllExtensions = true

[bootstrap.macos.defaults."com.apple.finder"]
# Search the current folder by default.
FXDefaultSearchScope = "SCcf"

[bootstrap.macos.defaults."com.apple.dashboard"]
"mcx-disabled" = true

[bootstrap.macos.defaults."com.apple.dock"]
"dashboard-in-overlay" = true

[bootstrap.macos.defaults."com.apple.screencapture"]
location = "/Users/ryan/Pictures/Screenshots"
type = "png"

[bootstrap.macos.defaults."com.apple.Safari.SandboxBroker"]
ShowDevelopMenu = true

[bootstrap.macos.defaults."com.google.Chrome"]
AppleEnableSwipeNavigateWithScrolls = false
AppleEnableMouseSwipeNavigateWithScrolls = false

[bootstrap.macos.defaults."org.gnu.Emacs"]
Menus = "NO"

[bootstrap.macos.defaults."com.knollsoft.Rectangle"]
almostMaximizeHeight = 1.0

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["70", "enabled"]
value = false

[bootstrap.hooks.post-defaults]
run = 'if [ "$(uname -s)" = Darwin ]; then chflags nohidden "$HOME/Library"; fi'
